name: Push Docker Image

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name the release is built from'
        required: true
        default: master
  workflow_call:
    inputs:
      branch:
        description: 'Branch name the release is built from'
        required: true
        type: string
        default: master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version
        id: get_version
        shell: bash
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0.0")
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract Target Framework
        shell: bash
        run: |
          FRAMEWORK=$(git grep -h -m 1 "<TargetFrameworks>" src/NzbDrone.Core/ | sed -e 's/.*<TargetFrameworks>\(.*\)<\/TargetFrameworks>.*/\1/')
          echo "FRAMEWORK=$FRAMEWORK" >> "$GITHUB_ENV"

      - name: Set up Node.js (Volta)
        uses: volta-cli/action@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Compile Backend & Frontend Packages
        run: |
          ./build.sh --backend --frontend --packages -f "${{ env.FRAMEWORK }}" -r linux-musl-x64
          ./build.sh --backend --frontend --packages -f "${{ env.FRAMEWORK }}" -r linux-musl-arm64
        env:
          PROWLARRVERSION: ${{ steps.get_version.outputs.VERSION }}
          BRANCH: ${{ inputs.branch }}
          BUILD_SOURCEBRANCHNAME: ${{ inputs.branch }}

      - name: Set Build Date
        shell: bash
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.get_version.outputs.VERSION }}
            type=raw,value=latest,enable=${{ inputs.branch == 'master' }}
            type=raw,value=${{ inputs.branch }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ env.BUILD_DATE }}
            VERSION=${{ steps.get_version.outputs.VERSION }}
            PROWLARR_BRANCH=${{ inputs.branch }}
            PACKAGE_AUTHOR=github.com/${{ github.repository }}
