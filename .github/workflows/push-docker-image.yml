name: Push Docker Image

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name the release is built from'
        required: true
        default: master
  workflow_call:
    inputs:
      branch:
        description: 'Branch name the release is built from'
        required: true
        type: string
        default: master
  workflow_run:
    workflows: ["Build"]
    types: [completed]

jobs:
  build:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.branch }}
          fetch-depth: 0

      - name: Extract Metadata & Determine Mode
        id: meta_env
        shell: bash
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0.0")
          VERSION="${TAG#v}"
          FRAMEWORK=$(git grep -h -m 1 "<TargetFrameworks>" src/NzbDrone.Core/ | sed -e 's/.*<TargetFrameworks>\(.*\)<\/TargetFrameworks>.*/\1/')
          
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            IS_PR="true"
            PR_NUM="${{ github.event.workflow_run.pull_requests[0].number }}"
            BRANCH="${{ github.event.workflow_run.head_branch }}"
          else
            IS_PR="false"
            PR_NUM=""
            BRANCH="${{ inputs.branch }}"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "FRAMEWORK=$FRAMEWORK" >> "$GITHUB_ENV"
          echo "IS_PR=$IS_PR" >> "$GITHUB_ENV"
          echo "PR_NUM=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Set up Node.js (Volta)
        uses: volta-cli/action@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Compile Backend & Frontend Packages
        run: |
          ./build.sh --backend --frontend --packages -f "${{ env.FRAMEWORK }}" -r linux-musl-x64

          if [ "${{ env.IS_PR }}" != "true" ]; then
            ./build.sh --backend --frontend --packages -f "${{ env.FRAMEWORK }}" -r linux-musl-arm64
          else
            mkdir -p _artifacts/linux-musl-arm64/${{ env.FRAMEWORK }}/Prowlarr
          fi
        env:
          PROWLARRVERSION: ${{ steps.meta_env.outputs.VERSION }}
          BRANCH: ${{ env.BRANCH }}
          BUILD_SOURCEBRANCHNAME: ${{ env.BRANCH }}

      - name: Set Build Date
        shell: bash
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=pr-${{ steps.meta_env.outputs.PR_NUM }},enable=${{ env.IS_PR == 'true' }}
            type=raw,value=${{ steps.meta_env.outputs.VERSION }},enable=${{ env.IS_PR != 'true' }}
            type=raw,value=latest,enable=${{ env.IS_PR != 'true' && env.BRANCH == 'master' }}
            type=raw,value=${{ env.BRANCH }},enable=${{ env.IS_PR != 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.IS_PR == 'true' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ env.BUILD_DATE }}
            VERSION=${{ steps.meta_env.outputs.VERSION }}
            PROWLARR_BRANCH=${{ env.BRANCH }}
            PACKAGE_AUTHOR=github.com/${{ github.repository }}
